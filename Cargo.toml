[package]
name = "notice"
version = "0.1.4"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }

[target.'cfg(target_os = "android")'.dependencies]
log = "0.4"
android_logger = "0.15.1"
android-activity = { version = "0.6", features = ["native-activity"] }
# 只开 backend-android-activity-06：Slint 的 Android 后端固定使用 Skia 渲染，femtovg 在
# Android 上是被禁用的（没有任何后端会用它），所以不需要也不能靠 renderer-femtovg 换渲染器。
# default-features = false：Slint 默认打开的是 winit/wayland/x11/femtovg/accesskit 那一整套
# 桌面后端，它们不会编进 Android 包，但会实打实写进 Cargo.lock（586 -> 343 个包）。
# compat-1-18 不能省：slint 用它做向前兼容检查，缺了会直接 compile_error。
slint = { version = "1.18.0", default-features = false, features = ["std", "backend-android-activity-06", "compat-1-18"] }

[build-dependencies]
slint-build = "1.18.0"

[package.metadata.android]
# 包名（必填）
package = "io.github.cgyf.notice"
# 要编译的 Android 目标架构
build_targets = ["aarch64-linux-android"]
# 可选配置
resources = "resources"   # 资源文件夹（注意：这个文件夹必须真实存在，否则依然会报错）
assets = "assets"         # 资产文件夹
apk_name = "notice"       # 最终 APK 文件名

# 应用在桌面（启动器 / 最近任务 / 应用信息页）显示的名字。
# cargo-rapk 的默认值取编译产物名（这里是 crate 名），所以必须显式写成 notice，
# 否则换个 crate 名 label 就会跟着变。
[package.metadata.android.application]
label = "notice"

# SDK 版本必须写在这张表里。写在 [package.metadata.android] 顶层会被当作未知字段静默忽略，
# 那种情况下 APK 用的是 NDK 的默认值（这里是 35），写在下面的值才真正生效。
[package.metadata.android.sdk]
# Slint 的 Android 后端要求 API 26 及以上（直接调用 AChoreographer 等 API 24/26 的符号），
# cargo-rapk 不写默认是 23，那样在 Android 6/7 上会加载失败。
min_sdk_version = 26
# 目标 API 30 需要本机装有 platforms;android-30；GitHub 的 ubuntu runner 只装了 34~37，
# 所以这里用 35（同时也是 Google Play 目前要求的 targetSdk 下限）。
target_sdk_version = 35
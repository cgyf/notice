name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: setup compile env
      run: rustup target add aarch64-linux-android
    - name: install rapk --target aarch64-linux-android
      run: cargo install cargo-rapk
    - name: Build
      run: cargo rapk build
    - name: Run tests
      run: cargo test --verbose

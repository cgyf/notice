name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: setup compile env
      run: rustup target add aarch64-linux-android
    - name: install rapk
      run: cargo install cargo-rapk
    - name: Build
      run: cargo rapk build --target aarch64-linux-android
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: notice-apk
        path: "target/debug/apk/*.apk"
        if-no-files-found: error
